services:
  postgres:
    image: postgres:17-alpine
    container_name: dispatchiq-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dispatchiq
      POSTGRES_PASSWORD: dispatchiq_dev_password
      POSTGRES_DB: dispatchiq

    ports:
      - '5432:5432'

    volumes:
      - dispatchiq_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dispatchiq -d dispatchiq']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dispatchiq_postgres_data:
